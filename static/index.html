<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>غرفة الهروب</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- THREE.JS CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- CROSSHAIR -->
    <div id="crosshair" class="crosshair hidden">
        <svg width="32" height="32" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
            <line x1="16" y1="4" x2="16" y2="12" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
            <line x1="16" y1="20" x2="16" y2="28" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
            <line x1="4" y1="16" x2="12" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
            <line x1="20" y1="16" x2="28" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
        </svg>
    </div>
    <div id="crosshairActive" class="crosshair-active hidden">
        <svg width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="6" fill="none" stroke="#ff6600" stroke-width="2"/>
            <line x1="20" y1="4" x2="20" y2="13" stroke="#ff6600" stroke-width="2"/>
            <line x1="20" y1="27" x2="20" y2="36" stroke="#ff6600" stroke-width="2"/>
            <line x1="4" y1="20" x2="13" y2="20" stroke="#ff6600" stroke-width="2"/>
            <line x1="27" y1="20" x2="36" y2="20" stroke="#ff6600" stroke-width="2"/>
        </svg>
    </div>

    <!-- INTERACTION PROMPT -->
    <div id="interactPrompt" class="interact-prompt hidden">
        <span id="promptText">انقر للتفاعل</span>
    </div>

    <!-- TIMER HUD -->
    <div id="timerDisplay" class="timer-hud hidden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span id="timerText">00:00</span>
    </div>

    <!-- INVENTORY -->
    <div id="inventoryBar" class="inventory-bar hidden">
        <div class="inventory-title">المخزن</div>
        <div id="inventorySlots" class="inventory-slots"></div>
    </div>

    <!-- MOBILE CONTROLS -->
    <div id="mobileControls" class="mobile-controls hidden">
        <div id="joystickZone" class="joystick-zone">
            <div id="joystickBase" class="joystick-base">
                <div id="joystickKnob" class="joystick-knob"></div>
            </div>
        </div>
        <div id="lookZone" class="look-zone"></div>
        <button id="mobileInteractBtn" class="mobile-interact-btn hidden">&#128073; تفاعل</button>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen" class="screen active">
        <div class="start-overlay"></div>
        <div class="start-content">
            <h1 class="game-title">&#128275; غرفة الهروب</h1>
            <p class="subtitle">هل يمكنك حل الألغاز والهروب قبل فوات الأوان؟</p>
            <div class="start-form">
                <div class="input-group">
                    <label for="playerName">اسم اللاعب</label>
                    <input type="text" id="playerName" placeholder="أدخل اسمك..." autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="roomName">اسم الغرفة</label>
                    <input type="text" id="roomName" placeholder="أدخل اسم الغرفة..." autocomplete="off" value="غرفة الهروب">
                </div>
                <button id="enterBtn" class="btn-enter">
                    <span>ابدأ اللعبة</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
                    </svg>
                </button>
            </div>
            <p class="controls-info" id="controlsInfo"></p>
        </div>
    </div>

    <!-- PHONE SCREEN OVERLAY (shows phone camera view) -->
    <div id="phoneOverlay" class="phone-overlay hidden">
        <div class="phone-frame">
            <div class="phone-notch"></div>
            <canvas id="phoneCanvas" width="320" height="480"></canvas>
            <button class="phone-close-btn" id="phoneCloseBtn">&times;</button>
        </div>
    </div>

    <!-- NUMPAD OVERLAY (Zone 1) -->
    <div id="numpadOverlay" class="overlay hidden">
        <div class="overlay-content numpad-panel">
            <button class="close-btn" id="numpadCloseBtn">&times;</button>
            <h2>&#128274; قفل رقمي</h2>
            <div class="numpad-display" id="numpadDisplay">----</div>
            <div class="numpad-grid">
                <button class="numpad-key" data-key="1">1</button>
                <button class="numpad-key" data-key="2">2</button>
                <button class="numpad-key" data-key="3">3</button>
                <button class="numpad-key" data-key="4">4</button>
                <button class="numpad-key" data-key="5">5</button>
                <button class="numpad-key" data-key="6">6</button>
                <button class="numpad-key" data-key="7">7</button>
                <button class="numpad-key" data-key="8">8</button>
                <button class="numpad-key" data-key="9">9</button>
                <button class="numpad-key numpad-clear" data-key="clear">&#9003;</button>
                <button class="numpad-key" data-key="0">0</button>
                <button class="numpad-key numpad-enter" data-key="enter">&#10003;</button>
            </div>
            <div id="numpadMessage" class="overlay-msg"></div>
        </div>
    </div>

    <!-- ALPHANUMERIC KEYBOARD OVERLAY (Zone 2) -->
    <div id="alphaOverlay" class="overlay hidden">
        <div class="overlay-content alpha-panel">
            <button class="close-btn" id="alphaCloseBtn">&times;</button>
            <h2>&#128274; قفل أبجدي رقمي</h2>
            <div class="alpha-display" id="alphaDisplay">----</div>
            <div class="alpha-keyboard" dir="ltr">
                <div class="alpha-row">
                    <button class="alpha-key" data-key="1">1</button>
                    <button class="alpha-key" data-key="2">2</button>
                    <button class="alpha-key" data-key="3">3</button>
                    <button class="alpha-key" data-key="4">4</button>
                    <button class="alpha-key" data-key="5">5</button>
                    <button class="alpha-key" data-key="6">6</button>
                    <button class="alpha-key" data-key="7">7</button>
                    <button class="alpha-key" data-key="8">8</button>
                    <button class="alpha-key" data-key="9">9</button>
                    <button class="alpha-key" data-key="0">0</button>
                </div>
                <div class="alpha-row">
                    <button class="alpha-key" data-key="A">A</button>
                    <button class="alpha-key" data-key="B">B</button>
                    <button class="alpha-key" data-key="C">C</button>
                    <button class="alpha-key" data-key="D">D</button>
                    <button class="alpha-key" data-key="E">E</button>
                    <button class="alpha-key" data-key="F">F</button>
                    <button class="alpha-key" data-key="G">G</button>
                    <button class="alpha-key" data-key="H">H</button>
                    <button class="alpha-key" data-key="I">I</button>
                    <button class="alpha-key" data-key="J">J</button>
                </div>
                <div class="alpha-row">
                    <button class="alpha-key" data-key="K">K</button>
                    <button class="alpha-key" data-key="L">L</button>
                    <button class="alpha-key" data-key="M">M</button>
                    <button class="alpha-key" data-key="N">N</button>
                    <button class="alpha-key" data-key="O">O</button>
                    <button class="alpha-key" data-key="P">P</button>
                    <button class="alpha-key" data-key="Q">Q</button>
                    <button class="alpha-key" data-key="R">R</button>
                    <button class="alpha-key" data-key="S">S</button>
                    <button class="alpha-key" data-key="T">T</button>
                </div>
                <div class="alpha-row">
                    <button class="alpha-key" data-key="U">U</button>
                    <button class="alpha-key" data-key="V">V</button>
                    <button class="alpha-key" data-key="W">W</button>
                    <button class="alpha-key" data-key="X">X</button>
                    <button class="alpha-key" data-key="Y">Y</button>
                    <button class="alpha-key" data-key="Z">Z</button>
                    <button class="alpha-key alpha-clear" data-key="clear">&#9003;</button>
                    <button class="alpha-key alpha-enter" data-key="enter">&#10003;</button>
                </div>
            </div>
            <div id="alphaMessage" class="overlay-msg"></div>
        </div>
    </div>

    <!-- WIN SCREEN -->
    <div id="winScreen" class="screen hidden">
        <div class="win-overlay"></div>
        <div class="win-content">
            <h1 class="win-title">&#127881; لقد هربت!</h1>
            <p class="win-subtitle">YOU ESCAPED!</p>
            <div class="win-time">
                <span>الوقت النهائي:</span>
                <span id="finalTime">00:00</span>
            </div>
            <button class="btn-restart" id="restartBtn">العب مرة أخرى</button>
        </div>
    </div>

    <!-- LOSE SCREEN -->
    <div id="loseScreen" class="screen hidden">
        <div class="lose-overlay"></div>
        <div class="lose-content">
            <h1 class="lose-title">&#128128; انتهى الوقت!</h1>
            <p class="lose-subtitle">TIME'S UP!</p>
            <p class="lose-msg">لم تتمكن من الهروب في الوقت المحدد</p>
            <button class="btn-restart" id="loseRestartBtn">حاول مرة أخرى</button>
        </div>
    </div>

    <!-- LOADING SCREEN -->
    <div id="loadingScreen" class="screen active">
        <div class="loading-content">
            <h2>جاري التحميل...</h2>
            <div class="loading-bar">
                <div class="loading-fill" id="loadingFill"></div>
            </div>
            <p id="loadingText">تحميل المجسمات والخامات...</p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="/static/game.js"></script>
</body>
</html>
