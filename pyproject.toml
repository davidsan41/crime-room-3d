[project]
name = "crime-room-game"
version = "1.0.0"
description = "Crime Room - Interactive 3D Escape Room Puzzle Game"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
